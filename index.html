<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TU Shooting Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<script src="js/i18n.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>TU Shooting <span>Scoreboard</span></h1>
      <p class="sub" id="subline">ISSF qualification scoring · ผลการแข่งขันสด</p>
    </div>
    <div class="status"><a class="hdr-link" id="boardLink" href="board.html"><span class="l-th">จอใหญ่</span><span class="l-en">Projector</span></a><span class="dot" id="liveDot"></span><span id="liveText">…</span></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Categories"></nav>

  <div class="bar filters" id="filters">
    <label class="f grow" for="q"><span class="l-th">ค้นหา</span><span class="l-en">Search</span>
      <input type="search" id="q" autocomplete="off" placeholder="ชื่อนักกีฬา หรือสังกัด" data-en-placeholder="Athlete or team name"></label>
    <label class="f" for="relaySel" id="relayWrap" hidden><span class="l-th">ผลัด</span><span class="l-en">Relay</span>
      <select id="relaySel"></select></label>
    <button type="button" id="clearF" class="ghost" hidden><span class="l-th">ล้างตัวกรอง</span><span class="l-en">Clear</span></button>
    <span class="meta" id="fCount"></span>
    <a class="plink" id="printLink" href="print.html"><span class="l-th">🖨 พิมพ์ผล</span><span class="l-en">🖨 Print</span></a>
  </div>

  <main>
    <section class="panel" aria-labelledby="resH">
      <h2 id="resH"><span id="boardTitle">ผลการแข่งขัน</span> <small id="evInfo"></small></h2>
      <div class="tablebox"><table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </section>
  </main>
  <div id="detail" class="modal" hidden role="dialog" aria-modal="true" aria-label="Athlete detail">
    <div class="modal-card"><button type="button" id="detailClose" class="ghost modal-x" aria-label="Close">✕</button><div id="detailBody"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/scoring.js"></script>
<script src="js/render.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let tab = 0;
  try { tab = Math.min(3, Math.max(0, +localStorage.getItem("tu-tab") || 0)); } catch (e) {}
  let state = null;
  const F = { q: Render.getParam("q") || "", relay: Render.getParam("relay") || "" };
  $("q").value = F.q;
  const c = Render.getParam("c");
  if (c) { $("boardLink").href = "board.html?c=" + encodeURIComponent(c); $("printLink").href = "print.html?c=" + encodeURIComponent(c); }

  function draw() {
    const comp = state && state.comp;
    document.title = comp ? comp.name + " · TU Shooting" : "TU Shooting Scoreboard";
    $("subline").textContent = Render.subline(comp);
    const list = state ? state.list() : [];
    $("tabs").innerHTML = Render.tabsHTML(tab, list);
    drawRelays(list);
    const h = Render.paint(
      { title: $("boardTitle"), info: $("evInfo"), thead: $("thead"), tbody: $("tbody") },
      { athletes: list, event: comp ? comp.event : "ap60", teamSize: comp ? comp.team_size : 3, tab, loading: !state || !state.loaded, filter: F, clickable: true });
    const on = !!(F.q.trim() || F.relay);
    $("clearF").hidden = !on;
    if (openId) drawDetail();
    $("fCount").textContent = on && h.count.total ? I18n.L(`แสดง ${h.count.shown} จาก ${h.count.total}`, `Showing ${h.count.shown} of ${h.count.total}`) : "";
    if (state && state.loaded && !comp)
      $("tbody").innerHTML = Render.noActiveHTML();
  }
  // relay dropdown: only shown when there is more than one relay
  function drawRelays(list) {
    const relays = [...new Set(list.map((a) => String(a.relay || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    if (F.relay && !relays.includes(F.relay)) relays.push(F.relay);
    const sel = $("relaySel");
    const html = `<option value="">${I18n.L("ทุกผลัด", "All relays")}</option>` + relays.map((r) => `<option value="${Render.esc(r)}">${I18n.L("ผลัด ", "Relay ")}${Render.esc(r)}</option>`).join("");
    if (sel.dataset.html !== html) { sel.innerHTML = html; sel.dataset.html = html; }   // do not rebuild while the list is open
    sel.value = F.relay;
    $("relayWrap").hidden = relays.length < 2 && !F.relay;
  }
  function syncUrl() {
    try {
      const u = new URL(location.href);
      for (const [k, v] of [["q", F.q.trim()], ["relay", F.relay]]) v ? u.searchParams.set(k, v) : u.searchParams.delete(k);
      history.replaceState(null, "", u);
    } catch (e) {}
  }
  let qTimer = null;
  $("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => { F.q = $("q").value; syncUrl(); draw(); }, 120); });
  $("relaySel").addEventListener("change", () => { F.relay = $("relaySel").value; syncUrl(); draw(); });
  $("clearF").addEventListener("click", () => { F.q = ""; F.relay = ""; $("q").value = ""; syncUrl(); draw(); });
  // athlete detail popup (live: refreshes when scores change while it is open)
  let openId = null;
  function drawDetail() {
    const comp = state && state.comp, list = state ? state.list() : [];
    const a = openId && list.find((x) => x.id === openId);
    if (!a || !comp) { closeDetail(); return; }
    $("detailBody").innerHTML = Render.detailHTML(a, list, comp.event);
  }
  function openDetail(id) { openId = id; $("detail").hidden = false; document.body.classList.add("modal-open"); drawDetail(); $("detailClose").focus(); }
  function closeDetail() { openId = null; $("detail").hidden = true; document.body.classList.remove("modal-open"); }
  $("tbody").addEventListener("click", (c) => { const tr = c.target.closest("tr[data-id]"); if (tr && tr.dataset.id) openDetail(tr.dataset.id); });
  $("tbody").addEventListener("keydown", (k) => { if (k.key === "Enter") { const tr = k.target.closest("tr[data-id]"); if (tr && tr.dataset.id) openDetail(tr.dataset.id); } });
  $("detailClose").addEventListener("click", closeDetail);
  $("detail").addEventListener("click", (e) => { if (e.target === $("detail")) closeDetail(); });
  document.addEventListener("keydown", (k) => { if (k.key === "Escape" && openId) closeDetail(); });
  $("tabs").addEventListener("click", (c) => {
    const b = c.target.closest("[data-t]");
    if (!b) return;
    tab = +b.dataset.t;
    try { localStorage.setItem("tu-tab", tab); } catch (e) {}
    draw();
  });
  let live = ["connecting"];
  const paintLive = () => Render.setLive($("liveDot"), $("liveText"), live[0], live[1]);
  TU.watch({
    id: Render.getParam("c"),
    onChange: (s) => { state = s; draw(); },
    onStatus: (s, m) => { live = [s, m]; paintLive(); }
  });
  I18n.onChange(() => { draw(); paintLive(); });
  paintLive();
  draw();
})();
</script>
</body>
</html>
