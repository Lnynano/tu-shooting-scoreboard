name: Tests

# Runs on every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scoring:
    name: Scoring tests + JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scoring logic vs prototype (parsing, ranking, tie-breaks, teams)
        run: node tests/scoring.test.js
      - name: Excel (.xlsx) export container, checksums and numbers
        run: node tests/xlsx.test.js
      - name: Rendering escapes hostile text (XSS)
        run: node tests/render.test.js
      - name: Excel paste import parsing
        run: node tests/import.test.js
      - name: Save engine helpers (two scorers never overwrite each other)
        run: node tests/patch.test.js
      - name: Realtime event handling (incl. deletes)
        run: node tests/athlete-events.test.js
      - name: Live API - anonymous visitors can read results and nothing else
        run: node tests/anon-security.test.js
      - name: Custom domain - CNAME matches the share tags
        run: node tests/domain.test.js
      - name: JavaScript syntax check
        run: |
          for f in js/*.js; do
            echo "checking $f"
            node --check "$f"
          done
