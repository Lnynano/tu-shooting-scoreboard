# Keeps the Supabase project awake. Free-plan projects pause after about a week without use,
# and a paused project means the scoreboard shows nothing. One small read per day counts as use.
# Uses only the public publishable key from js/config.js (read-only for anonymous visitors).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *"   # every day 03:17 UTC (10:17 Thailand)
  workflow_dispatch:        # "Run workflow" button for a manual check

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one competition row
        run: |
          eval "$(node -e '
            global.window = {}; require("./js/config.js");
            const c = window.TU_CONFIG; console.log(`URL=${c.url}\nKEY=${c.key}`);
          ' | sed 's/^/export /')"
          code=$(curl -s -o body.json -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/competitions?select=id&limit=1")
          echo "HTTP $code"
          # 200 = awake. Anything else (e.g. the project is already paused) fails the run, so GitHub e-mails the repo owner.
          test "$code" = "200"
