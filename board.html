<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TU Shooting Scoreboard — Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#c8102e">
<meta name="description" content="ผลการแข่งขันยิงปืนสดสำหรับจอใหญ่ · Live results for the big screen">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TU Shooting Scoreboard">
<meta property="og:title" content="TU Shooting Scoreboard — จอใหญ่ / Projector">
<meta property="og:description" content="ผลการแข่งขันยิงปืนสดสำหรับจอใหญ่ · Live results for the big screen">
<meta property="og:url" content="https://lnynano.github.io/tu-shooting-scoreboard/board.html">
<meta property="og:image" content="https://lnynano.github.io/tu-shooting-scoreboard/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<script src="js/i18n.js"></script>
</head>
<body class="board">
<div class="wrap">
  <header>
    <div>
      <img class="logo" src="img/logo.svg" alt="TU Shooting Club" width="56" height="56">
      <h1>TU Shooting <span>Scoreboard</span></h1>
      <p class="sub" id="subline">ISSF qualification scoring · ผลการแข่งขันสด</p>
      <p class="sub updated" id="updated"></p>
      <p class="nowbadge" id="now" hidden></p>
    </div>
    <div class="qrbox" id="qrBox" hidden>
      <div class="qrimg" id="qrSvg"></div>
      <div class="qrcap"><span class="l-th">สแกนดูผล<br>บนมือถือ</span><span class="l-en">Scan for<br>live results</span></div>
    </div>
    <div class="status">
      <span class="live-badge off" id="liveBadge">LIVE</span>
      <span class="dot" id="liveDot"></span><span id="liveText">…</span>
      <button type="button" id="pauseBtn" class="ghost" aria-pressed="false" title="Space"></button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Categories"></nav>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <main>
    <section class="panel" aria-labelledby="resH">
      <h2 id="resH"><span id="boardTitle">ผลการแข่งขัน</span> <small id="evInfo"></small></h2>
      <div class="tablebox"><table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/scoring.js"></script>
<script src="js/render.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/qr.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const CYCLE_MS = (+Render.getParam("every") || 15) * 1000;
  let tab = 0, paused = false, state = null, started = Date.now();

  function draw() {
    const comp = state && state.comp;
    document.title = (comp ? comp.name + " · " : "") + "TU Shooting Board";
    $("subline").textContent = Render.subline(comp);
    const list = state ? state.list() : [];
    $("updated").textContent = comp ? Render.updatedText(list) : "";
    $("now").textContent = Render.nowText(comp); $("now").hidden = !$("now").textContent;
    $("tabs").innerHTML = Render.tabsHTML(tab, list);
    Render.paint(
      { title: $("boardTitle"), info: $("evInfo"), thead: $("thead"), tbody: $("tbody") },
      { athletes: list, event: comp ? comp.event : "ap60", teamSize: comp ? comp.team_size : 3, nowRelay: comp ? comp.current_relay : "", tab, loading: !state || !state.loaded });
    if (state && state.loaded && !comp)
      $("tbody").innerHTML = Render.noActiveHTML();
  }
  function go(i) { tab = (i + 4) % 4; started = Date.now(); draw(); }
  function setPaused(p) {
    paused = p;
    $("pauseBtn").setAttribute("aria-pressed", String(p));
    paintPause();
    started = Date.now();
  }
  function paintPause() { $("pauseBtn").textContent = paused ? I18n.L("เล่นต่อ / Resume", "Resume") : I18n.L("หยุดสลับ / Pause", "Pause"); }
  $("pauseBtn").onclick = () => setPaused(!paused);
  $("tabs").addEventListener("click", (c) => { const b = c.target.closest("[data-t]"); if (b) go(+b.dataset.t); });
  document.addEventListener("keydown", (k) => {
    if (k.target.tagName === "BUTTON" && k.key === " ") return;
    if (k.key === " ") { k.preventDefault(); setPaused(!paused); }
    else if (k.key === "ArrowRight") go(tab + 1);
    else if (k.key === "ArrowLeft") go(tab - 1);
  });
  setInterval(() => {
    const el = Date.now() - started;
    $("bar").style.width = paused ? "100%" : Math.min(100, (el / CYCLE_MS) * 100) + "%";
    if (!paused && el >= CYCLE_MS) go(tab + 1);
  }, 200);

  // QR code to the public scoreboard (plain address = always the competition that is currently displayed)
  try { $("qrSvg").innerHTML = QR.svg(QR.publicUrl(false)); $("qrBox").hidden = false; } catch (e) {}
  let live = ["connecting"];
  const paintLive = () => {
    Render.setLive($("liveDot"), $("liveText"), live[0], live[1]);

    if (live[0] === "live") $("liveText").textContent = "";
    $("liveBadge").classList.toggle("off", live[0] !== "live");
  };
  TU.watch({
    id: Render.getParam("c"),
    onChange: (s) => { state = s; draw(); },
    onStatus: (s, m) => { live = [s, m]; paintLive(); }
  });
  I18n.onChange(() => { draw(); paintLive(); paintPause(); });
  paintLive(); paintPause();
  draw();
})();
</script>
</body>
</html>
